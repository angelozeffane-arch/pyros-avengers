<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0E17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PYROS Avengers">
<title>PYROS AVENGERS</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* --- DA PYROS Quotidien : bleu nuit, accent lavande unique --- */
  --deep:#0C0E17; --bg:#0C0E17; --bg-soft:#161826;
  --card:#181B2B; --card2:#1E2136; --card3:#232741;
  --border:rgba(145,132,217,.20); --border2:rgba(145,132,217,.40);
  --text:#F2F2F8; --muted:#9598B2; --muted2:#6E7189;
  --accent:#9184d9; --accent2:#B4A9F0;
  --green:#7FD8A8; --green-bg:rgba(127,216,168,.14);
  --red:#E8734A;   --red-bg:rgba(232,115,74,.14);
  --orange:#E8C24A; --orange-bg:rgba(232,194,74,.14);
  --blue:#7FB2E8;
  --r:16px; --rs:12px;
  --grid:rgba(145,132,217,.05);
  --glass:rgba(12,14,23,.94);
  --veil:rgba(8,9,16,.95);
  --btnink:#12121C;
  --top:#20233A;
  --shadow:none;
}
/* ---------- thème clair ---------- */
body.clair{
  --deep:#F4F4F8; --bg:#F4F4F8; --bg-soft:#FFFFFF;
  --card:#FFFFFF; --card2:#FBFBFD; --card3:#F2F1F9;
  --border:rgba(108,92,199,.20); --border2:rgba(108,92,199,.38);
  --text:#171A28; --muted:#6E7189; --muted2:#787B92;
  --accent:#6C5CC7; --accent2:#5A49B8;
  --green:#207D55; --green-bg:rgba(32,125,85,.12);
  --red:#B84A22;   --red-bg:rgba(184,74,34,.12);
  --orange:#966A05; --orange-bg:rgba(150,106,5,.12);
  --blue:#33709F;
  --grid:rgba(108,92,199,.055);
  --glass:rgba(255,255,255,.96);
  --veil:rgba(244,244,248,.95);
  --btnink:#FFFFFF;
  --top:#EDEBF8;
  --shadow:0 1px 2px rgba(23,26,40,.05),0 8px 24px -18px rgba(23,26,40,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% -8%,var(--top),var(--deep) 62%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:56px 56px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.4;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.015em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
svg{display:block}
.ico{width:1em;height:1em;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
@keyframes flipY{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);display:flex;align-items:center;gap:7px}
.kicker .num{background:var(--accent);color:var(--btnink);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px}
.muted{color:var(--muted)}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;perspective:600px}
#splash.hide{opacity:0;pointer-events:none}
#splash .sflame{width:76px;height:76px;color:var(--text);animation:flipY 2.4s linear infinite}
#splash .sname{font-weight:700;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--text)}
#splash .stag{font-size:9px;letter-spacing:.34em;color:var(--muted2);text-transform:uppercase}
header{position:sticky;top:0;z-index:40;background:var(--glass);border-bottom:1px solid var(--border);padding:calc(11px + env(safe-area-inset-top)) 16px 11px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:700;font-size:14.5px;letter-spacing:.16em;display:flex;align-items:center;gap:9px;text-transform:uppercase;color:var(--text);perspective:500px}
.logo .lflame{width:23px;height:23px;color:var(--accent2);animation:flipY 3.6s linear infinite}
.hdr-right{text-align:right}
.hdr-date{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:capitalize}
.hdr-clock{font-size:12px;color:var(--accent2);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-top:1px}
.page{padding:16px 14px 18px;max-width:640px;margin:0 auto;animation:fade .22s ease}
.sec-head{margin:2px 0 13px}
.sec-head h2{font-size:19px;margin-top:7px;letter-spacing:-.02em}
.sec-head p{color:var(--muted);font-size:12px;margin:3px 0 0}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}
.weather{background:linear-gradient(150deg,var(--card3),var(--card));border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.w-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.w-loc{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;min-width:0}
.w-loc .ico{width:14px;height:14px;color:var(--accent2);flex:0 0 auto}
.w-loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-btns{display:flex;gap:6px;flex:0 0 auto}
.w-btn{width:30px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--border);display:grid;place-items:center;color:var(--accent2)}
.w-btn .ico{width:15px;height:15px}
.w-main{display:flex;align-items:center;gap:12px;margin:10px 0 2px}
.w-main .wico{width:46px;height:46px;color:var(--accent2);flex:0 0 auto}
.w-temp{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.w-desc{color:var(--muted);font-size:12px;text-transform:capitalize;margin-top:1px}
.w-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:12px}
.w-item{display:flex;align-items:center;gap:7px;font-size:12px}
.w-item .ico{width:15px;height:15px;color:var(--accent2);flex:0 0 auto}
.w-item .l{color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
.w-item .v{font-weight:600}
.w-search{margin-top:11px}
.w-in{display:flex;gap:7px}
.w-in input{flex:1;background:var(--bg-soft);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--text);font-size:13px}
.w-in input:focus{outline:none;border-color:var(--accent)}
.w-in button{background:var(--accent);color:var(--btnink);font-weight:700;padding:0 15px;border-radius:9px;font-size:12px}
.w-results{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.w-res{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;text-align:left;font-size:13px}
.w-res .ico{width:14px;height:14px;color:var(--accent2)}
.w-res b{font-weight:600}.w-res small{color:var(--muted);font-size:11px}
.w-msg{font-size:11.5px;color:var(--muted2);margin-top:8px;text-align:center}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:var(--r);padding:14px 13px;text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.mod:active{transform:scale(.98)}
.mod .mico{width:28px;height:28px;color:var(--accent2);margin-bottom:8px}
.mod .t{font-weight:700;font-size:14.5px}
.mod .c{font-size:11px;color:var(--muted);margin-top:2px}
.st{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--border2);display:grid;place-items:center;flex:0 0 auto;transition:.14s;background:var(--card2);color:var(--muted2)}
.st .ico{width:15px;height:15px}
.st.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.st.missed{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.exo{background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 11px;margin-bottom:8px}
.exo-top{display:flex;align-items:center;gap:10px}
.exo-name{flex:1;min-width:0}
.exo-name .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.exo-name .tag{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:20px;display:inline-block;margin-top:4px}
.tag.muscu{background:var(--border2);color:var(--accent2)}
.tag.cali{background:rgba(127,178,232,.18);color:var(--blue)}
.tag.poly{background:var(--orange-bg);color:var(--orange)}
.exo-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.field{display:flex;align-items:center;gap:5px;background:var(--bg-soft);border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-size:11px}
.field label{color:var(--muted2);font-size:9px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.field input{width:34px;background:none;border:none;color:var(--text);font-size:12.5px;font-weight:600;text-align:center;padding:0}
.field input:focus{outline:none;color:var(--accent2)}
.field.vid{flex:1}.field.vid input{width:100%;text-align:left}
.iconbtn{width:30px;height:30px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.iconbtn .ico{width:15px;height:15px}
.iconbtn:active{transform:scale(.92)}
.iconbtn.on{color:var(--accent2);border-color:var(--accent)}
.iconbtn.rest{color:var(--blue)}
.exo-vidrow{margin-top:9px;display:none}
.exo-vidrow.open{display:block}
.vidbox{position:relative;width:100%;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:#000;border:1px solid var(--border);margin-bottom:8px}
.vidbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidlink{color:var(--accent2);font-size:12px;text-decoration:none;font-weight:600;margin-bottom:8px;display:inline-flex;align-items:center;gap:5px}
.wk-nav,.cal-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:8px 11px;margin-bottom:12px}
.wk-nav button,.cal-nav button{width:32px;height:32px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--accent2);display:grid;place-items:center}
.wk-nav button .ico,.cal-nav button .ico{width:16px;height:16px}
.wk-nav .lbl{font-weight:700;font-size:13px;text-align:center}
.wk-nav .lbl small{display:block;color:var(--muted);font-weight:500;font-size:10px}
.cal-nav .m{font-weight:700;font-size:15px;text-transform:capitalize}
.day{margin-bottom:11px}
.day-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.day-head .dnum{width:40px;height:40px;border-radius:11px;background:var(--card2);border:1px solid var(--border);display:grid;place-items:center;text-align:center;flex:0 0 auto}
.day-head .dnum b{font-size:15px;line-height:1;display:block}
.day-head .dnum span{font-size:8px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.day-head.done .dnum{background:var(--green-bg);border-color:var(--green)}
.day-head.missed .dnum{background:var(--red-bg);border-color:var(--red)}
.day-head.partial .dnum{background:var(--orange-bg);border-color:var(--orange)}
.day-head .dinfo{flex:1;min-width:0}
.day-head .dinfo input{background:none;border:none;color:var(--text);font-weight:700;font-size:14px;width:100%;padding:0}
.day-head .dinfo input:focus{outline:none;color:var(--accent2)}
.day-head .dinfo .ds{font-size:10px;color:var(--muted);text-transform:capitalize}
.badge{font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.badge.done{background:var(--green-bg);color:var(--green)}
.badge.missed{background:var(--red-bg);color:var(--red)}
.badge.partial{background:var(--orange-bg);color:var(--orange)}
.badge.rest{background:var(--card3);color:var(--muted)}
.addbtn{width:100%;padding:9px;border:1.5px dashed var(--border2);border-radius:var(--rs);color:var(--muted);font-weight:600;font-size:12px;background:none;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:6px}
.addbtn .ico{width:14px;height:14px}
.addbtn:active{border-color:var(--accent);color:var(--accent2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:9px;color:var(--muted2);font-weight:700;text-transform:uppercase;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:9px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;position:relative}
.cell.empty{background:none;border:none}
.cell.done{background:var(--green-bg);border-color:var(--green)}
.cell.missed{background:var(--red-bg);border-color:var(--red)}
.cell.partial{background:var(--orange-bg);border-color:var(--orange)}
.cell.today{box-shadow:0 0 0 2px var(--accent)}
.cell .dot{position:absolute;bottom:4px;display:flex;gap:2px}
.cell .dot i{width:3.5px;height:3.5px;border-radius:50%;display:block}
.dot .w{background:var(--blue)}.dot .s{background:var(--accent2)}.dot .z{background:var(--orange)}
.synth-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:12px}
.stat .big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat .lab{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:4px}
.stat .lab .ico{width:12px;height:12px}
.stat .sub{font-size:10px;color:var(--muted2);margin-top:3px}
.bar{height:7px;border-radius:5px;background:var(--bg-soft);overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.chartwrap{background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 8px 6px;margin-top:10px}
.watergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}
.wcell{aspect-ratio:1;border-radius:11px;background:var(--card2);border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)}
.wcell .ico{width:20px;height:20px}
.wcell small{font-size:8.5px}
.wcell.full{background:rgba(127,178,232,.18);border-color:var(--blue);color:var(--blue)}
.wcell:active{transform:scale(.9)}
.suppbtn{flex:1;padding:13px;border-radius:var(--rs);background:var(--card2);border:1.5px solid var(--border);text-align:center}
.suppbtn .se{width:24px;height:24px;margin:0 auto 5px;color:var(--accent2)}
.suppbtn .n{font-weight:700;font-size:12.5px}
.suppbtn .s{font-size:10px;color:var(--muted);margin-top:1px}
.suppbtn.on{background:var(--green-bg);border-color:var(--green)}
.suppbtn.on .se,.suppbtn.on .s{color:var(--green)}
.bigin{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:11px 12px}
.bigin input{flex:1;background:none;border:none;color:var(--text);font-size:18px;font-weight:700;min-width:0}
.bigin input:focus{outline:none}
.bigin .u{color:var(--muted);font-weight:600;font-size:12px}
.bigin .ic{width:20px;height:20px;color:var(--accent2);flex:0 0 auto}
.mini-lab{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px;margin-bottom:7px}
.mini-lab .ico{width:14px;height:14px;color:var(--accent2)}
.rowbetween{display:flex;align-items:center;justify-content:space-between;gap:11px}
.toggle{width:42px;height:24px;border-radius:20px;background:var(--card3);position:relative;transition:.2s;flex:0 0 auto;border:1px solid var(--border)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s}
.toggle.on{background:var(--green-bg);border-color:var(--green)}
.toggle.on::after{left:20px;background:var(--green)}
.empty-note{text-align:center;color:var(--muted2);font-size:12px;padding:22px 10px}
.hint{font-size:11px;color:var(--muted2);padding:7px 2px 0}
nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--glass);border-top:1px solid var(--border);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--muted2);border-radius:11px}
.tab .ti{width:20px;height:20px}
.tab .tl{font-size:9.5px;font-weight:600}
.tab.active{color:var(--accent2)}
.overlay{position:fixed;inset:0;z-index:100;background:var(--veil);display:none;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}
.timer-box{background:var(--bg-soft);border:1px solid var(--border2);border-radius:22px;padding:26px 22px;text-align:center;width:100%;max-width:330px}
.timer-box .lab{font-size:11px;color:var(--accent2);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.timer-box .cd{font-size:58px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.timer-box .ex{color:var(--muted);font-size:13px;margin-bottom:14px;min-height:16px}
.presets{display:flex;gap:7px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.presets button{padding:6px 12px;border-radius:20px;background:var(--card2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted)}
.presets button:active{border-color:var(--accent);color:var(--accent2)}
.timer-ctrl{display:flex;gap:9px;justify-content:center}
.timer-ctrl button{padding:10px 18px;border-radius:11px;font-weight:700;font-size:13px}
.tc-add{background:var(--card2);border:1px solid var(--border);color:var(--text)}
.tc-stop{background:var(--red-bg);border:1px solid var(--red);color:var(--red)}

/* --- DA Quotidien : chiffres tabulaires, traits fins, une seule forme --- */
.mono,.num,.val,.kpi,.cd,.hdr-clock{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ico{stroke-width:1.7}
.card,.weather{border-radius:var(--r)}
/* --- bouton de thème --- */
.thbtn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:999px;
  width:32px;height:32px;font-size:14px;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.thbtn:hover{border-color:var(--accent);color:var(--text)}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-right .hdr-txt{text-align:right}
</style>
</head>
<body>

<div id="splash">
  <svg class="sflame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="sname">PYROS AVENGERS</div><div class="stag">Training</div>
</div>

<header>
  <div class="brand">
    <div class="logo">

function scheduleNotif(){if(notifTimer)clearInterval(notifTimer);notifTimer=setInterval(()=>{try{new Notification("PYROS Avengers",{body:"Bois un verre d'eau !"})}catch(e){}},7200000)}
let restInt=null,restLeft=0;
function startRest(sec,name){restLeft=sec||90;document.getElementById("restEx").textContent=name||"";document.getElementById("restOverlay").classList.add("open");updateRest();if(restInt)clearInterval(restInt);restInt=setInterval(()=>{restLeft--;updateRest();if(restLeft<=0){stopRest();try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}},1000)}
function updateRest(){const m=Math.floor(Math.max(0,restLeft)/60),s=Math.max(0,restLeft)%60;document.getElementById("restCd").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function setRest(n){restLeft=n;updateRest();if(!restInt)startRest(n,document.getElementById("restEx").textContent)}
function addRest(n){restLeft+=n;updateRest()}
function stopRest(){if(restInt)clearInterval(restInt);restInt=null;document.getElementById("restOverlay").classList.remove("open")}
function tickClock(){const el=document.getElementById("hdrClock");if(el)el.textContent=new Date().toLocaleTimeString("fr-FR")}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
if(state.notif)scheduleNotif();
tickClock();setInterval(tickClock,1000);
render();
if(state.weather&&state.weather.lat!=null&&Date.now()-(state.weather.ts||0)>1800000)wxRefresh();
setTimeout(()=>{document.getElementById("splash").classList.add("hide")},1300);

/* ============ thème clair / sombre ============ */
(function(){
  const TKEY = "pyros_sport_theme";
  let mode = "sombre";
  try { mode = localStorage.getItem(TKEY) || "sombre"; } catch(e){}
  const btn = document.getElementById("btnTheme");
  function appliquer(){
    document.body.classList.toggle("clair", mode === "clair");
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", mode === "clair" ? "#F4F4F8" : "#0C0E17");
    const st = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (st) st.setAttribute("content", mode === "clair" ? "default" : "black-translucent");
    if (btn) btn.textContent = mode === "clair" ? "◑" : "◐";
  }
  if (btn) btn.addEventListener("click", () => {
    mode = (mode === "clair") ? "sombre" : "clair";
    try { localStorage.setItem(TKEY, mode); } catch(e){}
    appliquer();
    if (typeof render === "function") render();      // les vues qui écrivent des couleurs se refont
  });
  appliquer();
})();
</script>
